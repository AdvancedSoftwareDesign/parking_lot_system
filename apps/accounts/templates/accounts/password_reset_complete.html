<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            background: #f3f7fc; font-family: Arial, sans-serif;
            padding: 20px;
        }
        .card {
            max-width: 420px; padding: 36px; background: white;
            border-radius: 16px; text-align: center;
            box-shadow: 0 8px 30px rgba(30, 64, 175, 0.08);
        }
        h1 { color: #1e3a8a; }
        p { color: #64748b; line-height: 1.6; }
        a {
            display: inline-block; margin-top: 15px; padding: 12px 24px;
            background: #2563eb; color: white; border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Password Reset Complete</h1>
        <p>Your password has been changed successfully.</p>
        <a href="{% url 'login' %}">Sign In</a>
    </main>
</body>
</html>
