<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f7fc;
            font-family: Arial, sans-serif;
            color: #1e293b;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            padding: 36px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(30, 64, 175, 0.08);
        }
        h1 { color: #1e3a8a; font-size: 25px; }
        p { color: #64748b; line-height: 1.6; font-size: 14px; }
        label { display: block; margin: 22px 0 8px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        a { color: #2563eb; text-decoration: none; font-size: 14px; }
        .errorlist { color: #b91c1c; font-size: 13px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Forgot your password?</h1>
        <p>Enter your account email address and we will help you reset your password.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.email.errors }}
            <label for="id_email">Email address</label>
            {{ form.email }}
            <button type="submit">Send Reset Instructions</button>
        </form>

        <p><a href="{% url 'login' %}">Back to Sign In</a></p>
    </main>
</body>
</html>
