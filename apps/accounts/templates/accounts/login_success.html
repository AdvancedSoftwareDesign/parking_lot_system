<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Successful</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f7fc;
            font-family: Arial, sans-serif;
            color: #1e293b;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(30, 64, 175, 0.08);
        }

        h1 {
            color: #1d4ed8;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Sign In Successful!</h1>
        <p>Welcome, {{ request.user.username }}.</p>
        <p>You are now signed in to the parking management system.</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Sign Out</button>
        </form>
    </main>
</body>
</html>
