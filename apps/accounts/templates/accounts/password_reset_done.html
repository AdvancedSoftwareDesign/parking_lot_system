<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            background: #f3f7fc; font-family: Arial, sans-serif;
            color: #1e293b; padding: 20px;
        }
        .card {
            max-width: 420px; padding: 36px; background: white;
            border-radius: 16px; text-align: center;
            box-shadow: 0 8px 30px rgba(30, 64, 175, 0.08);
        }
        h1 { color: #1e3a8a; }
        p { color: #64748b; line-height: 1.6; }
        a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Check Your Email</h1>
        <p>If an account matches the email address you entered, password reset instructions have been sent.</p>
        <p><a href="{% url 'login' %}">Back to Sign In</a></p>
    </main>
</body>
</html>
